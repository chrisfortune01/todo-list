<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo list</title>
</head>
<body>
    <p>Todo List Practice</p>
    <input 
        type="text"
        placeholder="Todo name"
        class="js-todo-name"
        onkeydown="event
        if (event.key === 'Enter') {
            addInput();
        }"
    >
    <button onclick="addInput()">Add</button>
    <div class="todo-item"></div>

    <script>
        const todoArray = []
        const inputElement = document.querySelector('.js-todo-name');
        renderTodoList()

        function renderTodoList() {
            let displayTodoHTML = ''
            for (let i = 0; i < todoArray.length; i++) {
                const arrayValue = todoArray[i];
                const displayTodo = `<p>${arrayValue}</p>`;
                displayTodoHTML += displayTodo
            }
            document.querySelector('.todo-item').innerHTML = displayTodoHTML;
        }
        function addInput() {
            if (inputElement.value) {
                todoArray.push(inputElement.value)
                console.log(todoArray)
            }
            inputElement.value = '';
            renderTodoList()
        }
        
    </script>
</body>
</html>

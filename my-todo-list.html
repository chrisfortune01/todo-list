<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo list</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        .todo-grid, .todo-input-grid {
            display: grid;
            grid-template-columns: 200px 150px 100px;
            column-gap: 10px;
            row-gap: 10px;
            margin-top: 10px;
            align-items: center;
        }
        .todo-input-grid {
            align-items: stretch;
        }
        .input-style {
            font-size: 15px;
            padding: 5px;
        }
        .add-button {
            background-color: rgb(20, 170, 20);
            color: white;
            border: none;
            cursor: pointer;
        }
        .delete-button {
            background-color: rgb(170, 20, 20);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p>Todo List Practice</p>
    <div class="todo-input-grid">
        <input 
            type="text"
            placeholder="Todo name"
            class="js-todo-name input-style"
            onkeydown="event
            if (event.key === 'Enter') {
                addInput();
            }"
        >
        <input
            type="date"
            class="js-date input-style"
        >
        <button onclick="addInput()" class="add-button">Add</button>
    </div>
    <div class="todo-item todo-grid"></div>

    <script>
        const todoArray = [
            {
                name: 'clean the house',
                dueDate: '2022-07-14'
            }, 
            {
                name: 'wash the dishes',
                dueDate: '2022-07-14'
            }
        ]
        renderTodoList()
        function renderTodoList() {
            let displayTodoHTML = ''
            for (let i = 0; i < todoArray.length; i++) {
                const arrayObject = todoArray[i];
                // const name = arrayObject.name;
                // const dueDate = arrayObject.dueDate;
                const { name, dueDate } = arrayObject;
                const displayTodo = `
                    <div>${name}</div>
                    <div>${dueDate}</div> 
                    <button class="delete-button" onclick="
                        todoArray.splice(${i}, 1);
                        renderTodoList();
                    ">Delete</button>
                `;
                displayTodoHTML += displayTodo;
            }
            console.log(document.querySelector('.todo-item').innerHTML = displayTodoHTML);
        }
        function addInput() {
            const nameInputElement = document.querySelector('.js-todo-name');
            const dateElement = document.querySelector('.js-date');
            let name = nameInputElement.value;
            let dueDate = dateElement.value;
            if (name && dueDate) {
                todoArray.push({name,dueDate})
                console.log(todoArray)
            }
            nameInputElement.value = '',
            dateElement.value = '';
            renderTodoList()
        }
    </script>
</body>
</html>
